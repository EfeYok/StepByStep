[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepbystep"
version = "0.1.0"
description = "Seçilen dizinleri izleyip değiştiklerinde zip'leyerek bir vault'a yedekleyen araç"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sbs = "sbs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
